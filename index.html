<style>

<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
let W,H,G,mode='menu',paused=false,last=0,shake=0,best=0;
try{best=+localStorage.getItem('ls_best')||0}catch(e){}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}

const hash=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const mod=(a,b)=>((a%b)+b)%b,fmt=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const TY={w:{hp:8,sp:62,r:10,dm:6,c:'#6bbf59',d:'#3b7a35'},r:{hp:5,sp:115,r:8,dm:5,c:'#e8913f',d:'#9c5219'},b:{hp:42,sp:46,r:17,dm:14,c:'#9b59b6',d:'#56306a'},x:{hp:420,sp:50,r:34,dm:26,c:'#d6453a',d:'#701c16'},y:{hp:900,sp:42,r:40,dm:30,c:'#2fa5b5',d:'#155a66'},z:{hp:600,sp:60,r:30,dm:28,c:'#e0457b',d:'#7a1c40'},q:{hp:700,sp:45,r:32,dm:22,c:'#7b5fd6',d:'#3d2c80'}};
const UP=[
{ic:'⚡',n:'Rapid Fire',d:'Fire 20% faster',f:()=>G.w.cd*=.8},
{ic:'🔱',n:'Multi Shot',d:'+1 projectile',f:()=>G.w.n++},
{ic:'💥',n:'Power',d:'+30% damage',f:()=>G.w.dmg*=1.3},
{ic:'👟',n:'Swift Boots',d:'+15% move speed',f:()=>G.p.sp*=1.15},
{ic:'❤️',n:'Vitality',d:'+25 max HP and heal 40',f:()=>{G.p.mh+=25;G.p.hp=Math.min(G.p.mh,G.p.hp+40)}},
{ic:'🧲',n:'Magnet',d:'Gem pickup range +50%',f:()=>G.p.mg*=1.5},
{ic:'🌀',n:'Orbit Blades',d:'Blades circle you',f:()=>G.orb++},
{ic:'🎯',n:'Pierce',d:'Bolts hit +1 more enemy',f:()=>G.w.pi++},
{ic:'💣',n:'Grenades',d:'Lob explosives at the horde',f:()=>{}},
{ic:'🌩️',n:'Chain Lightning',d:'Zap jumps between enemies',f:()=>{}},
{ic:'🌊',n:'Shockwave',d:'Pulse that blasts enemies away',f:()=>{}},
{ic:'🔥',n:'Flamethrower',d:'Burn everything in front of you',f:()=>{}},
{ic:'🚀',n:'RPG',d:'Rockets with a huge blast radius',f:()=>{}}];
function init(){G={p:{x:0,y:0,hp:100,mh:100,sp:150,mg:70,r:12,fa:0,fl:0,wk:0},w:{cd:.6,t:0,n:1,dmg:10,pi:0},orb:0,oa:0,en:[],bl:[],gm:[],pt:[],dn:[],xp:0,nx:5,lv:1,t:0,k:0,sp:0,j:null,jx:0,jy:0,uc:{},nb:60,ob:[],fx:[],gr:[],tg:1,tl:1,tn:3,mf:0,pb:0,ev:0,xm:1,mg:0,tm:0,tr:1,rk:[]}}
function menuInit(){init();G.w.n=3;G.w.cd=.35;G.orb=2;G.uc={'Grenades':2,'Chain Lightning':2,'Shockwave':1}}
const BN={x:'WARLORD',y:'JUGGERNAUT',z:'CHARGER',q:'SUMMONER'},BH={w:105,r:28,b:280};
function tier(){return Math.floor((G.lv-1)/3)}
function banner(t){const b=$('ban');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');sfx('boss')}
function spawnE(k,x,y){const T=TY[k],ti=tier(),bs=!!BN[k],hp=T.hp*D.hp*(1+G.t/60*.35)*(bs?1+Math.max(0,G.lv/10-1)*.5:1+ti*.25),e={k,x,y,hp,mh:hp,sp:(T.sp+G.t*.15)*D.sp*(bs?1:1+ti*.08),r:T.r,dm:T.dm*D.dm*(bs?1:1+ti*.1),fl:0,ph:Math.random()*6,bs,cd:3,dash:0};
if(!bs){const h=(BH[k]+ti*47)%360;e.c='hsl('+h+',55%,52%)';e.d='hsl('+h+',55%,30%)'}G.en.push(e)}
function spawn(){const a=Math.random()*6.283,d=Math.max(W,H)*.65,r=Math.random(),t=G.t;let k='w';if(t>60&&r<.12)k='b';else if(t>25&&r<.35)k='r';spawnE(k,G.p.x+Math.cos(a)*d,G.p.y+Math.sin(a)*d)}
function nearest(){let b=null,bd=1e9;for(const e of G.en){const d=(e.x-G.p.x)**2+(e.y-G.p.y)**2;if(d<bd){bd=d;b=e}}return b}
function dmg(e,d,n){e.hp-=d;e.fl=.08;if(n)sfx('hit');if(n&&G.dn.length<30)G.dn.push({x:e.x,y:e.y-e.r,v:Math.round(d),t:.55})}
function burst(x,y,c,n,s){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*s;G.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,m:.5,c,s:2+Math.random()*2})}}
function upd(dt){const g=G,p=g.p,pl=mode=='play';g.t+=dt;
g.mf-=dt;const mv=Math.hypot(g.jx,g.jy);p.x+=g.jx*p.sp*dt;p.y+=g.jy*p.sp*dt;if(mv>.1){p.wk+=dt*12;if(Math.random()<.3)g.pt.push({x:p.x,y:p.y+12,vx:(Math.random()-.5)*20,vy:-10,l:.35,m:.35,c:'#8a8f9c',s:3})}p.fl-=dt;shake=Math.max(0,shake-dt*20);
g.sp-=dt;if(g.sp<=0){const n=1+Math.floor(g.t/20);for(let i=0;i<n&&g.en.length<220;i++)spawn();g.sp=Math.max(.25,1.1-g.t/120)/D.sr}
if(pl&&g.t>=g.nb){g.nb+=60;const a=Math.random()*6.283;spawnE('x',p.x+Math.cos(a)*W,p.y+Math.sin(a)*W);banner('⚠ WARLORD INCOMING')}
if(pl&&g.pb){const k='yzq'[(g.pb/10-1)%3],a=Math.random()*6.283;g.pb=0;spawnE(k,p.x+Math.cos(a)*W,p.y+Math.sin(a)*W);banner('⚠ '+BN[k]+' APPEARS')}
else if(pl&&g.ev){g.ev=0;banner('☠ ZOMBIES EVOLVED')}
const ne=nearest();p.fa=ne&&(ne.x-p.x)**2+(ne.y-p.y)**2<160000?Math.atan2(ne.y-p.y,ne.x-p.x):(mv>.1?Math.atan2(g.jy,g.jx):p.fa);
g.w.t-=dt;if(g.w.t<=0&&ne&&(ne.x-p.x)**2+(ne.y-p.y)**2<160000){const n=g.w.n;for(let i=0;i<n;i++){const o=p.fa+(i-(n-1)/2)*.18;g.bl.push({x:p.x+Math.cos(p.fa)*16,y:p.y+Math.sin(p.fa)*16,vx:Math.cos(o)*400,vy:Math.sin(o)*400,l:1.1,pi:g.w.pi,h:new Set()})}g.w.t=g.w.cd;g.mf=.06;sfx('shoot')}
for(const b of g.bl){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;for(const e of g.en){if(b.h.has(e))continue;if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+5)**2){dmg(e,b.dm||g.w.dmg,!b.dm);if(!b.dm)burst(b.x,b.y,'#ffe066',2,90);b.h.add(e);if(b.pi--<=0){b.l=0;break}}}}
g.bl=g.bl.filter(b=>b.l>0);
const gl=g.uc['Grenades']||0,ll=g.uc['Chain Lightning']||0,nl=g.uc['Shockwave']||0;
if(gl){g.tg-=dt;if(g.tg<=0&&g.en.length){const t=g.en[Math.floor(Math.random()*g.en.length)];if((t.x-p.x)**2+(t.y-p.y)**2<176400){g.gr.push({x:p.x,y:p.y,tx:t.x,ty:t.y,sx:p.x,sy:p.y,t:0});g.tg=2.4/(1+.2*gl);sfx('throw')}else g.tg=.3}}
for(const o of g.gr){o.t+=dt/.6;const k=Math.min(1,o.t);o.x=o.sx+(o.tx-o.sx)*k;o.y=o.sy+(o.ty-o.sy)*k;if(o.t>=1){o.d=1;const R=70+gl*9;for(const e of g.en)if((e.x-o.x)**2+(e.y-o.y)**2<(R+e.r)**2)dmg(e,28+gl*12,1);g.fx.push({k:'ex',x:o.x,y:o.y,r:R,t:.35,m:.35});burst(o.x,o.y,'#ff9a3c',14,200);shake=Math.max(shake,5);sfx('boom')}}
g.gr=g.gr.filter(o=>!o.d);
if(ll){g.tl-=dt;if(g.tl<=0&&ne){let c=ne,n=2+ll;const pts=[[p.x,p.y]],hit=new Set();while(c&&n-->=0){pts.push([c.x,c.y]);dmg(c,16+ll*6,1);hit.add(c);let nx=null,bd=22500;for(const e of g.en){if(hit.has(e))continue;const d=(e.x-c.x)**2+(e.y-c.y)**2;if(d<bd){bd=d;nx=e}}c=nx}g.fx.push({k:'ln',pts,t:.18,m:.18});g.tl=Math.max(.6,1.6-ll*.12);sfx('zap')}}
if(nl){g.tn-=dt;if(g.tn<=0&&g.en.length){g.fx.push({k:'rg',x:p.x,y:p.y,r:110+nl*14,t:.4,m:.4,hit:new Set()});g.tn=Math.max(2,4.5-nl*.35);sfx('wave')}}
for(const f of g.fx){f.t-=dt;if(f.k=='rg'){f.x=p.x;f.y=p.y;const cr=f.r*(1-f.t/f.m);for(const e of g.en)if(!f.hit.has(e)&&Math.hypot(e.x-p.x,e.y-p.y)<cr+e.r){f.hit.add(e);dmg(e,14+nl*7,1);const a=Math.atan2(e.y-p.y,e.x-p.x);e.x+=Math.cos(a)*40;e.y+=Math.sin(a)*40}}}
const fl=g.uc['Flamethrower']||0,rl=g.uc['RPG']||0;
if(g.mg){g.tm-=dt;if(g.tm<=0&&ne&&(ne.x-p.x)**2+(ne.y-p.y)**2<176400){const o=p.fa+(Math.random()-.5)*.22;g.bl.push({x:p.x+Math.cos(p.fa)*16,y:p.y+Math.sin(p.fa)*16,vx:Math.cos(o)*520,vy:Math.sin(o)*520,l:.7,pi:0,h:new Set(),dm:g.w.dmg*.45});g.tm=.07;g.mf=.05;sfx('mg')}}
if(fl&&ne&&(ne.x-p.x)**2+(ne.y-p.y)**2<19600){const R=95+fl*10;for(const e of g.en){const dx=e.x-p.x,dy=e.y-p.y,an=Math.atan2(dy,dx);if(Math.hypot(dx,dy)<R+e.r&&Math.abs(Math.atan2(Math.sin(an-p.fa),Math.cos(an-p.fa)))<.6)dmg(e,(20+fl*8)*dt,0)}
for(let i=0;i<3;i++){const o=p.fa+(Math.random()-.5)*.5,v=160+Math.random()*120;g.pt.push({x:p.x+Math.cos(p.fa)*14,y:p.y+Math.sin(p.fa)*14,vx:Math.cos(o)*v,vy:Math.sin(o)*v,l:.35,m:.35,c:Math.random()<.5?'#ff8a1a':'#ffd23c',s:4+Math.random()*3})}sfx('flame')}
if(rl){g.tr-=dt;if(g.tr<=0&&ne&&(ne.x-p.x)**2+(ne.y-p.y)**2<250000){g.rk.push({x:p.x,y:p.y,vx:Math.cos(p.fa)*280,vy:Math.sin(p.fa)*280,l:1.6});g.tr=3.2/(1+.15*rl);sfx('throw')}}
for(const r of g.rk){r.x+=r.vx*dt;r.y+=r.vy*dt;r.l-=dt;g.pt.push({x:r.x,y:r.y,vx:0,vy:0,l:.3,m:.3,c:'#c8c8c8',s:3});let ht=r.l<=0;for(const e of g.en)if((e.x-r.x)**2+(e.y-r.y)**2<(e.r+8)**2){ht=true;break}
if(ht){r.d=1;const R=95+rl*10;for(const e of g.en)if((e.x-r.x)**2+(e.y-r.y)**2<(R+e.r)**2)dmg(e,60+rl*25,1);g.fx.push({k:'ex',x:r.x,y:r.y,r:R,t:.4,m:.4});burst(r.x,r.y,'#ff9a3c',18,240);shake=Math.max(shake,7);sfx('boom')}}
g.rk=g.rk.filter(r=>!r.d);
g.fx=g.fx.filter(f=>f.t>0);
g.oa+=dt*3.2;g.ob=[];for(let i=0;i<g.orb;i++){const a=g.oa+i*6.283/g.orb;g.ob.push({x:p.x+Math.cos(a)*52,y:p.y+Math.sin(a)*52,a})}
for(const e of g.en){e.fl-=dt;const a=Math.atan2(p.y-e.y,p.x-e.x);let sm=1;if(e.k=='z'){e.cd-=dt;if(e.cd<=0){e.cd=3;e.dash=.6;shake=Math.max(shake,4)}if(e.dash>0){e.dash-=dt;sm=4}}
if(e.k=='q'){e.cd-=dt;if(e.cd<=0&&g.en.length<230){e.cd=3.5;spawnE('w',e.x+30,e.y);spawnE('w',e.x-30,e.y);burst(e.x,e.y,'#7b5fd6',10,120)}}
